<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBet — Teams</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #7c3aed; --purple-light: #a855f7; --pink: #ec4899;
    }

    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Exo 2', sans-serif; color: #c4c8e2;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(124,58,237,.26), transparent 60%),
        radial-gradient(900px 600px at 40% 80%, rgba(236,72,153,.22), transparent 55%),
        #070b1f;
    }

    .bg-blobs { position: fixed; inset: 0; pointer-events: none; z-index: 0; filter: blur(70px); opacity: .85; }
    .blob {
      position: absolute; width: 460px; height: 460px; border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, rgba(124,58,237,.95), transparent 60%),
                  radial-gradient(circle at 65% 65%, rgba(236,72,153,.90), transparent 62%);
      animation: floaty 5s ease-in-out infinite;
    }
    .b1{top:-140px;left:-140px} .b2{top:12%;right:-180px;animation-delay:-1s} .b3{bottom:-200px;left:30%;animation-delay:-2s}
    @keyframes floaty{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(40px,-30px,0) scale(1.08)}}

    .page { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ══════════════ HEADER STICKY INTERNE ══════════════ */
    .teams-header {
      flex-shrink: 0;
      padding: 20px 28px 0;
      background: rgba(7,11,31,0.55);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      z-index: 5;
    }

    .th-title-row {
      display: flex; align-items: baseline; gap: 12px;
      margin-bottom: 14px;
    }
    .th-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 26px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: #fff;
    }
    .th-count {
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.3);
    }
    .th-count strong { color: #c084fc; }

    /* Search */
    .th-search {
      position: relative; margin-bottom: 14px;
    }
    .th-search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,0.3); pointer-events: none;
    }
    .th-search-icon svg { width: 14px; height: 14px; display: block; }
    .th-search input {
      width: 100%; padding: 9px 12px 9px 36px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px; color: #e8eaf6;
      font-family: 'Exo 2', sans-serif; font-size: 12px; font-weight: 500;
      outline: none; transition: border-color 0.18s, background 0.18s;
    }
    .th-search input::placeholder { color: rgba(255,255,255,0.28); }
    .th-search input:focus { border-color: rgba(168,85,247,0.5); background: rgba(255,255,255,0.07); }

    /* Filter + sort row */
    .th-filter-row {
      display: flex; align-items: center; gap: 8px;
      padding-bottom: 14px;
      flex-wrap: wrap;
    }

    .game-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 16px; border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.4);
      font-family: 'Exo 2', sans-serif; font-size: 11px; font-weight: 700;
      letter-spacing: 0.7px; text-transform: uppercase;
      cursor: pointer; transition: all 0.18s; white-space: nowrap;
    }
    .game-pill img { width: 20px; height: 20px; object-fit: contain; opacity: 0.5; transition: opacity 0.18s, transform 0.18s; }
    .game-pill-count {
      font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 10px;
      background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.3);
      transition: background 0.18s, color 0.18s;
    }
    .game-pill:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.18); }
    .game-pill:hover img { opacity: 0.8; transform: scale(1.08); }
    .game-pill.active img { opacity: 1; transform: scale(1.05); }

    /* Active — CS2 orange */
    .game-pill[data-game="cs2"].active {
      background: rgba(249,115,22,0.1); border-color: rgba(249,115,22,0.55); color: #fb923c;
      box-shadow: 0 0 0 1px rgba(249,115,22,0.15), 0 2px 14px rgba(249,115,22,0.1);
    }
    .game-pill[data-game="cs2"].active .game-pill-count { background: rgba(249,115,22,0.2); color: #fb923c; }

    /* Active — LoL gold */
    .game-pill[data-game="lol"].active {
      background: rgba(200,168,75,0.1); border-color: rgba(200,168,75,0.55); color: #fbbf24;
      box-shadow: 0 0 0 1px rgba(200,168,75,0.15), 0 2px 14px rgba(200,168,75,0.1);
    }
    .game-pill[data-game="lol"].active .game-pill-count { background: rgba(200,168,75,0.2); color: #fbbf24; }

    /* Active — Valorant rouge */
    .game-pill[data-game="valo"].active {
      background: rgba(255,70,85,0.1); border-color: rgba(255,70,85,0.55); color: #f87171;
      box-shadow: 0 0 0 1px rgba(255,70,85,0.15), 0 2px 14px rgba(255,70,85,0.1);
    }
    .game-pill[data-game="valo"].active .game-pill-count { background: rgba(255,70,85,0.2); color: #f87171; }

    /* Active — Rocket League bleu */
    .game-pill[data-game="rl"].active {
      background: rgba(0,178,255,0.1); border-color: rgba(0,178,255,0.55); color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(0,178,255,0.15), 0 2px 14px rgba(0,178,255,0.1);
    }
    .game-pill[data-game="rl"].active .game-pill-count { background: rgba(0,178,255,0.2); color: #38bdf8; }

    /* Sort */
    .th-sort {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
    }
    .th-sort label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.28); white-space: nowrap;
    }
    .th-sort select {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 8px; padding: 5px 10px;
      color: rgba(255,255,255,0.65);
      font-family: 'Exo 2', sans-serif; font-size: 11px; font-weight: 600;
      cursor: pointer; outline: none;
    }
    .th-sort select option { background: #13172e; }

    /* ══════════════ SCROLLABLE GRID AREA ══════════════ */
    .teams-scroll {
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      padding: 22px 28px 48px;
      scrollbar-width: thin;
      scrollbar-color: rgba(168,85,247,0.2) transparent;
    }
    .teams-scroll::-webkit-scrollbar { width: 4px; }
    .teams-scroll::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); border-radius: 4px; }

    /* ══════════════ TEAMS GRID ══════════════ */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .empty-state {
      grid-column: 1/-1; text-align: center; padding: 60px 20px;
      color: rgba(255,255,255,0.25); font-size: 14px;
    }

    /* ══════════════ TEAM CARD ══════════════ */
    .team-card {
      background: rgba(13,17,40,0.85);
      border: 1px solid rgba(139,92,246,0.13);
      border-radius: 18px; overflow: hidden;
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 20px 22px;
      gap: 0;
      transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
      position: relative;
    }
    .team-card:hover {
      transform: translateY(-5px);
      border-color: rgba(139,92,246,0.42);
      box-shadow: 0 12px 36px rgba(0,0,0,0.4), 0 0 0 1px rgba(139,92,246,0.15);
    }

    /* Next match indicator dot — top right */
    .tc-match-dot {
      position: absolute; top: 12px; right: 12px;
      width: 7px; height: 7px; border-radius: 50%;
      background: #a855f7; box-shadow: 0 0 6px rgba(168,85,247,0.7);
    }

    /* Logo */
    .tc-logo {
      width: 80px; height: 80px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px; margin-bottom: 14px;
      flex-shrink: 0;
    }
    .tc-logo img { width: 62px; height: 62px; object-fit: contain; }
    .tc-logo-init {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px; font-weight: 700;
    }

    /* Name */
    .tc-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
      color: #fff; text-align: center; line-height: 1.2;
    }

    /* Game badge */
    .tc-game {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 5px;
      font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }
    .tc-game img { width: 11px; height: 11px; object-fit: contain; opacity: 0.6; }

    /* Rank */
    .tc-rank {
      margin-top: 8px;
      font-size: 9px; font-weight: 700; color: rgba(168,85,247,0.7);
      background: rgba(124,58,237,0.11); border: 1px solid rgba(124,58,237,0.2);
      border-radius: 4px; padding: 2px 7px; letter-spacing: 0.5px;
    }

    /* ══════════════ DETAIL VIEW ══════════════ */
    #view-detail { display: none; flex-direction: column; flex: 1; min-height: 0; }

    .detail-scroll {
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      padding: 0 28px 48px;
      scrollbar-width: thin; scrollbar-color: rgba(168,85,247,0.2) transparent;
    }
    .detail-scroll::-webkit-scrollbar { width: 4px; }
    .detail-scroll::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); border-radius: 4px; }

    /* Back button */
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 22px 0 18px;
      font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
      color: rgba(255,255,255,0.35); cursor: pointer; background: none; border: none;
      transition: color 0.15s;
    }
    .back-btn svg { width: 13px; height: 13px; transition: transform 0.15s; }
    .back-btn:hover { color: rgba(255,255,255,0.7); }
    .back-btn:hover svg { transform: translateX(-3px); }

    /* Team hero */
    .team-hero {
      display: flex; align-items: flex-start; gap: 26px;
      padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 0;
    }
    .hero-logo {
      width: 90px; height: 90px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
    }
    .hero-logo img { width: 70px; height: 70px; object-fit: contain; }
    .hero-logo-init { font-family: 'Rajdhani', sans-serif; font-size: 26px; font-weight: 700; }
    .hero-info { flex: 1; }
    .hero-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: #fff; line-height: 1;
    }
    .hero-sub { display: flex; align-items: center; gap: 10px; margin-top: 7px; flex-wrap: wrap; }
    .hero-game { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.38); }
    .hero-game img { width: 15px; height: 15px; object-fit: contain; }
    .hero-rank { font-size: 10px; font-weight: 700; color: #c084fc; background: rgba(124,58,237,0.14); border: 1px solid rgba(124,58,237,0.28); border-radius: 5px; padding: 2px 8px; }
    .hero-region { font-size: 10px; color: rgba(255,255,255,0.3); }
    .hero-stats { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
    .hs { display: flex; flex-direction: column; gap: 2px; }
    .hs-val { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; color: #fff; line-height: 1; }
    .hs-val.green { color: #4ade80; }
    .hs-val.red { color: #ef4444; }
    .hs-val.purple { color: #c084fc; }
    .hs-lbl { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.3); }

    /* Tabs */
    .detail-tabs { display: flex; gap: 2px; border-bottom: 1px solid rgba(255,255,255,0.07); margin-top: 22px; }
    .dtab { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 9px 16px; cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
    .dtab:hover { color: rgba(255,255,255,0.65); }
    .dtab.active { color: #c084fc; border-bottom-color: var(--purple); }

    .tab-panel { display: none; padding-top: 20px; }
    .tab-panel.active { display: block; }

    /* ── Roster ── */
    .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 11px; }
    .player-card { background: rgba(13,17,40,0.85); border: 1px solid rgba(139,92,246,0.12); border-radius: 13px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
    .player-card:hover { transform: translateY(-3px); border-color: rgba(139,92,246,0.3); }
    .pc-top { height: 100px; position: relative; background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(236,72,153,0.1)); display: flex; align-items: center; justify-content: center; }
    .pc-initial { font-family: 'Rajdhani', sans-serif; font-size: 40px; font-weight: 700; color: rgba(255,255,255,0.1); }
    .pc-role { position: absolute; top: 7px; right: 7px; font-size: 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
    .pc-body { padding: 10px 12px 12px; }
    .pc-nick { font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; color: #fff; }
    .pc-name { font-size: 9px; color: rgba(255,255,255,0.36); margin-top: 1px; line-height: 1.3; }
    .pc-flag { font-size: 14px; margin-top: 6px; }

    /* ── Match lists ── */
    .match-list { display: flex; flex-direction: column; gap: 8px; }
    .ml-row { display: flex; align-items: center; gap: 12px; background: rgba(13,17,40,0.8); border: 1px solid rgba(139,92,246,0.1); border-radius: 12px; padding: 12px 15px; transition: background 0.15s, border-color 0.15s; }
    .ml-row.clickable { cursor: pointer; }
    .ml-row.clickable:hover { background: rgba(19,23,46,0.95); border-color: rgba(139,92,246,0.28); }
    .ml-event { font-size: 9px; color: rgba(255,255,255,0.3); width: 130px; flex-shrink: 0; line-height: 1.35; }
    .ml-teams { display: flex; align-items: center; gap: 10px; flex: 1; }
    .ml-team { display: flex; align-items: center; gap: 6px; }
    .ml-team img { width: 22px; height: 22px; object-fit: contain; }
    .ml-team-init { width: 22px; height: 22px; border-radius: 5px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.4); }
    .ml-tname { font-size: 12px; font-weight: 700; color: #fff; }
    .ml-vs { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.2); }
    .ml-date { font-size: 9px; color: rgba(255,255,255,0.3); flex-shrink: 0; text-align: right; min-width: 50px; }
    .ml-odds { display: flex; gap: 5px; flex-shrink: 0; }
    .ml-odd { font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 800; color: #fff; background: rgba(7,11,31,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 3px 8px; cursor: pointer; transition: border-color 0.15s; }
    .ml-odd:hover { border-color: rgba(168,85,247,0.5); }
    .ml-score { font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.5); flex-shrink: 0; }
    .ml-result { flex-shrink: 0; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; padding: 3px 8px; border-radius: 5px; }
    .ml-result.win  { background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
    .ml-result.loss { background: rgba(239,68,68,0.1);  color: #ef4444; border: 1px solid rgba(239,68,68,0.16); }

    /* ── Stats ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 11px; margin-bottom: 22px; }
    .stat-box { background: rgba(13,17,40,0.85); border: 1px solid rgba(139,92,246,0.12); border-radius: 13px; padding: 16px 18px; }
    .stat-box-val { font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 700; color: #fff; line-height: 1; }
    .stat-box-val.green { color: #4ade80; } .stat-box-val.purple { color: #c084fc; }
    .stat-box-lbl { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.28); margin-top: 5px; }
    .stat-box-sub { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 3px; }

    .sec-lbl { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.27); margin-bottom: 12px; margin-top: 20px; }
    .sec-lbl:first-child { margin-top: 0; }
    .perf-sec { display: flex; flex-direction: column; gap: 12px; }
    .perf-row { display: flex; flex-direction: column; gap: 5px; }
    .perf-hd { display: flex; justify-content: space-between; }
    .perf-lbl { font-size: 10px; color: rgba(255,255,255,0.35); font-weight: 700; }
    .perf-pct { font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700; color: #fff; }
    .perf-track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .perf-fill { height: 100%; border-radius: 3px; }
    .perf-fill.g { background: linear-gradient(90deg, #4ade80, #22d3ee); }
    .perf-fill.p { background: linear-gradient(90deg, #7c3aed, #a855f7); }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="page">
    <script src="header.js"></script>

    <div class="content-layout">
      <script src="sidebar-left.js"></script>

      <!-- ══════════ MAIN CONTENT ══════════ -->
      <main class="main-content" style="display:flex;flex-direction:column;">

        <!-- LIST VIEW -->
        <div id="view-list" style="display:flex;flex-direction:column;flex:1;min-height:0;">

          <!-- Sticky header -->
          <div class="teams-header">
            <div class="th-title-row">
              <div class="th-title">Teams</div>
              <div class="th-count" id="team-count"></div>
            </div>

            <div class="th-search">
              <span class="th-search-icon">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <circle cx="6.5" cy="6.5" r="4.5"/><path d="M10.5 10.5L14 14"/>
                </svg>
              </span>
              <input type="text" id="search-input" placeholder="Search teams…" oninput="renderTeams()"/>
            </div>

            <div class="th-filter-row">
              <button class="game-pill" data-game="cs2" onclick="setGame('cs2',this)">
                <img src="img_M/logocs2.png" alt=""/> CS2
                <span class="game-pill-count" id="cnt-cs2">0</span>
              </button>
              <button class="game-pill active" data-game="lol" onclick="setGame('lol',this)">
                <img src="img_M/logo lol.png" alt=""/> LoL
                <span class="game-pill-count" id="cnt-lol">0</span>
              </button>
              <button class="game-pill" data-game="valo" onclick="setGame('valo',this)">
                <img src="img_M/logo valo.png" alt=""/> Valorant
                <span class="game-pill-count" id="cnt-valo">0</span>
              </button>
              <button class="game-pill" data-game="rl" onclick="setGame('rl',this)">
                <img src="img_M/logo rocket league.png" alt=""/> Rocket League
                <span class="game-pill-count" id="cnt-rl">0</span>
              </button>

              <div class="th-sort">
                <label for="sort-sel">Sort</label>
                <select id="sort-sel" onchange="renderTeams()">
                  <option value="popularity">Popularity</option>
                  <option value="rank">World Ranking</option>
                  <option value="name">Name A–Z</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Grid -->
          <div class="teams-scroll">
            <div class="teams-grid" id="teams-grid"></div>
          </div>

        </div><!-- /view-list -->

        <!-- DETAIL VIEW -->
        <div id="view-detail">
          <div class="detail-scroll">

  /* ═══════════════════════════

  function logoHtml(logo, name, size, color) {
    if (logo) return '<img src="' + logo + '" alt="' + (name||'') + '" style="width:' + size + 'px;height:' + size + 'px;object-fit:contain;" onerror="this.style.display=\'none\'">';
    return '<span class="tc-logo-init" style="color:' + (color||'#fff') + '">' + (name||'???').slice(0,3).toUpperCase() + '</span>';
  }
  function mlImg(logo, name, size) {
    if (logo) return '<img src="' + logo + '" alt="" style="width:' + size + 'px;height:' + size + 'px;object-fit:contain;" onerror="this.style.display=\'none\'">';
    return '<div class="ml-team-init">' + (name||'???').slice(0,3) + '</div>';
  }

  /* ═══════════════════════════
     FILTER / RENDER
  ═══════════════════════════ */
  function updateCounts() {
    var counts = { cs2:0, lol:0, valo:0, rl:0 };
    TEAMS.forEach(function(t) { if (counts[t.game] !== undefined) counts[t.game]++; });
    Object.keys(counts).forEach(function(g) {
      var el = document.getElementById('cnt-' + g);
      if (el) el.textContent = counts[g];
    });
  }

  function setGame(game, btn) {
    currentGame = game;
    document.querySelectorAll('.game-pill').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    renderTeams();
  }

  function renderTeams() {
    var sortBy = document.getElementById('sort-sel').value;
    var query  = (document.getElementById('search-input').value || '').trim().toLowerCase();

    var list = TEAMS.filter(function(t) {
      var gameOk = currentGame === 'all' || t.game === currentGame;
      var nameOk = !query || t.name.toLowerCase().includes(query) || t.short.toLowerCase().includes(query);
      return gameOk && nameOk;
    });

    /* Sort: teams with upcoming match first (by popularity), then rest */
    list.sort(function(a, b) {
      var aHas = a.nextMatch ? 1 : 0;
      var bHas = b.nextMatch ? 1 : 0;
      if (aHas !== bHas) return bHas - aHas;
      if (sortBy === 'rank')  return a.rank - b.rank;
      if (sortBy === 'name')  return a.name.localeCompare(b.name);
      return b.popularity - a.popularity;
    });

    var cnt = document.getElementById('team-count');
    cnt.innerHTML = '<strong>' + list.length + '</strong> team' + (list.length !== 1 ? 's' : '');

    var grid = document.getElementById('teams-grid');
    grid.innerHTML = list.length
      ? list.map(buildCard).join('')
      : '<div class="empty-state">No teams found.</div>';
  }

  /* ═══════════════════════════
     CARD
  ═══════════════════════════ */
  function buildCard(t) {
    var g   = GAMES[t.game];
    var dot = t.nextMatch ? '<div class="tc-match-dot" title="Upcoming match"></div>' : '';
    var gamePill = g
      ? '<div class="tc-game"><img src="' + g.logo + '" alt=""/> ' + g.name + '</div>'
      : '';
    return [
      '<div class="team-card" onclick="window.location.href=\'KarmineCorp.html\'" title="View ' + t.name + '">',
      '  ' + dot,
      '  <div class="tc-logo">' + logoHtml(t.logo, t.short, 62, t.color) + '</div>',
      '  <div class="tc-name">' + t.name + '</div>',
      '  ' + gamePill,
      '</div>',
    ].join('');
  }

  /* ═══════════════════════════
     NAVIGATION
  ═══════════════════════════ */
  function goMatch(page) { window.location.href = page; }

  function showList() {
    document.getElementById('view-detail').style.display = 'none';
    document.getElementById('view-list').style.display   = 'flex';
    document.querySelector('.main-content').scrollTop = 0;
  }

  function showTeam(id) {
    var t = TEAMS.find(function(x) { return x.id === id; });
    if (!t) return;
    document.querySelectorAll('.dtab').forEach(function(b)     { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.dtab')[0].classList.add('active');
    document.getElementById('tab-roster').classList.add('active');
    populateDetail(t);
    document.getElementById('view-list').style.display   = 'none';
    document.getElementById('view-detail').style.display = 'flex';
    document.querySelector('.detail-scroll').scrollTop = 0;
  }

  function switchTab(tab, btn) {
    document.querySelectorAll('.dtab').forEach(function(b)     { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
  }

  /* ═══════════════════════════
     DETAIL
  ═══════════════════════════ */
  function populateDetail(t) {
    var g = GAMES[t.game];

    var heroLogo = t.logo
      ? '<img src="' + t.logo + '" alt="' + t.short + '" style="width:70px;height:70px;object-fit:contain;">'
      : '<span class="hero-logo-init" style="color:' + (t.color||'#fff') + '">' + t.short.slice(0,3) + '</span>';

    document.getElementById('detail-hero').innerHTML = [
      '<div class="team-hero">',
      '  <div class="hero-logo">' + heroLogo + '</div>',
      '  <div class="hero-info">',
      '    <div class="hero-name">' + t.name + '</div>',
      '    <div class="hero-sub">',
      '      ' + (g ? '<div class="hero-game"><img src="' + g.logo + '" alt=""/> ' + g.name + '</div>' : ''),
      '      <div class="hero-rank">#' + t.rank + ' World</div>',
      '      <div class="hero-region">· ' + t.region + '</div>',
      '    </div>',
      '    <div class="hero-stats">',
      '      <div class="hs"><div class="hs-val">' + t.stats.played + '</div><div class="hs-lbl">Matches</div></div>',
      '      <div class="hs"><div class="hs-val green">' + t.stats.wins + '</div><div class="hs-lbl">Wins</div></div>',
      '      <div class="hs"><div class="hs-val red">' + t.stats.losses + '</div><div class="hs-lbl">Losses</div></div>',
      '      <div class="hs"><div class="hs-val purple">' + t.stats.winRate + '%</div><div class="hs-lbl">Win Rate</div></div>',
      '    </div>',
      '  </div>',
      '</div>',
    ].join('');

    /* Roster */
    document.getElementById('tab-roster').innerHTML = '<div class="roster-grid">' + t.roster.map(function(p) {
      var rc = ROLE_STYLE[p.role] || {bg:'rgba(255,255,255,0.08)',color:'#e2e8f0'};
      return '<div class="player-card"><div class="pc-top"><span class="pc-initial">' + p.nick.slice(0,1) + '</span><span class="pc-role" style="background:' + rc.bg + ';color:' + rc.color + ';border:1px solid ' + rc.color + '33">' + p.role + '</span></div><div class="pc-body"><div class="pc-nick">' + p.nick + '</div><div class="pc-name">' + p.name + '</div><div class="pc-flag">' + p.flag + '</div></div></div>';
    }).join('') + '</div>';

    /* Upcoming */
    var noMatch = '<div style="padding:36px 0;text-align:center;color:rgba(255,255,255,0.25);font-size:13px">No upcoming matches.</div>';
    document.getElementById('tab-upcoming').innerHTML = '<div class="match-list">' + (t.upcoming && t.upcoming.length ? t.upcoming.map(function(m) {
      return '<div class="ml-row clickable" onclick="goMatch(\'' + (m.page||'match.html') + '\')">' +
        '<div class="ml-event">' + m.event + '</div>' +
        '<div class="ml-teams"><div class="ml-team">' + mlImg(t.logo, t.short, 22) + '<span class="ml-tname">' + t.short + '</span></div>' +
        '<div class="ml-vs">VS</div>' +
        '<div class="ml-team">' + mlImg(m.oppLogo, m.oppName, 22) + '<span class="ml-tname">' + m.oppName + '</span></div></div>' +
        '<div class="ml-date">' + m.date + '</div>' +
        '<div class="ml-odds"><div class="ml-odd" onclick="event.stopPropagation();goMatch(\'' + (m.page||'match.html') + '\')">' + m.myOdds + '</div><div class="ml-odd" onclick="event.stopPropagation();goMatch(\'' + (m.page||'match.html') + '\')">' + m.oppOdds + '</div></div>' +
        '</div>';
    }).join('') : noMatch) + '</div>';

    /* Results */
    document.getElementById('tab-results').innerHTML = '<div class="match-list">' + (t.results && t.results.length ? t.results.map(function(r) {
      return '<div class="ml-row">' +
        '<div class="ml-event">' + r.event + '</div>' +
        '<div class="ml-teams"><div class="ml-team">' + mlImg(t.logo, t.short, 22) + '<span class="ml-tname">' + t.short + '</span></div>' +
        '<div class="ml-vs">VS</div>' +
        '<div class="ml-team">' + mlImg(r.oppLogo, r.oppName, 22) + '<span class="ml-tname">' + r.oppName + '</span></div></div>' +
        '<div class="ml-date">' + r.date + '</div>' +
        '<div class="ml-score">' + r.score + '</div>' +
        '<div class="ml-result ' + (r.win?'win':'loss') + '">' + (r.win?'WIN':'LOSS') + '</div>' +
        '</div>';
    }).join('') : noMatch) + '</div>';

    /* Stats */
    var s = t.stats;
    var mpm = (s.maps/s.played).toFixed(1);
    document.getElementById('tab-stats').innerHTML =
      '<div class="stats-grid">' +
      '<div class="stat-box"><div class="stat-box-val">' + s.played + '</div><div class="stat-box-lbl">Matches Played</div><div class="stat-box-sub">All time</div></div>' +
      '<div class="stat-box"><div class="stat-box-val green">' + s.wins + '</div><div class="stat-box-lbl">Victories</div><div class="stat-box-sub">' + s.losses + ' losses</div></div>' +
      '<div class="stat-box"><div class="stat-box-val purple">' + s.winRate + '%</div><div class="stat-box-lbl">Win Rate</div><div class="stat-box-sub">Overall</div></div>' +
      '<div class="stat-box"><div class="stat-box-val">' + s.maps + '</div><div class="stat-box-lbl">Maps Played</div><div class="stat-box-sub">Avg ' + mpm + ' / match</div></div>' +
      '</div>' +
      '<div class="sec-lbl">Performance</div>' +
      '<div class="perf-sec">' +
      '<div class="perf-row"><div class="perf-hd"><span class="perf-lbl">Win Rate</span><span class="perf-pct">' + s.winRate + '%</span></div><div class="perf-track"><div class="perf-fill g" style="width:' + s.winRate + '%"></div></div></div>' +
      '<div class="perf-row"><div class="perf-hd"><span class="perf-lbl">Maps / Match</span><span class="perf-pct">' + mpm + '</span></div><div class="perf-track"><div class="perf-fill p" style="width:' + Math.min(100,Math.round(parseFloat(mpm)/3*100)) + '%"></div></div></div>' +
      '<div class="perf-row"><div class="perf-hd"><span class="perf-lbl">World Ranking</span><span class="perf-pct">#' + t.rank + '</span></div><div class="perf-track"><div class="perf-fill p" style="width:' + Math.max(5,Math.round((20-t.rank)/20*100)) + '%"></div></div></div>' +
      '</div>';
  }

  /* ═══════════════════════════
     INIT
  ═══════════════════════════ */
  updateCounts();
  renderTeams();
  </script>
</body>
</html>
