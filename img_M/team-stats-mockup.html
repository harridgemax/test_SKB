<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Exo 2', sans-serif; color: #fff;
      background: transparent; display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; padding: 0;
    }

    .card {
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
      position: relative;
    }
    .card::before { display: none; }

    /* ── TABS ── */
    .ts-tabs {
      display: flex; gap: 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: relative; z-index: 1;
    }
    .ts-tab {
      font-family: 'Exo 2', sans-serif; font-size: 13px; font-weight: 700;
      padding: 12px 20px; cursor: pointer;
      color: rgba(255,255,255,0.4); border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.2px;
    }
    .ts-tab:hover { color: rgba(255,255,255,0.7); }
    .ts-tab.active { color: #fff; border-bottom-color: #a78bfa; }
    .ts-close {
      margin-left: auto; display: flex; align-items: center; padding: 0 18px;
      font-size: 18px; color: rgba(255,255,255,0.3); cursor: pointer;
    }
    .ts-close:hover { color: rgba(255,255,255,0.7); }

    /* ── HEADER ── */
    .ts-header {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; padding: 16px 24px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      position: relative; z-index: 1;
    }
    .ts-team {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 800;
    }
    .ts-team-right { justify-content: flex-end; }
    .ts-team-logo {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .ts-title {
      font-family: 'Rajdhani', sans-serif; font-size: 18px; font-weight: 700;
      color: rgba(255,255,255,0.85); letter-spacing: 1px; text-transform: uppercase;
      text-align: center;
    }

    /* ── STATS ── */
    .ts-body {
      padding: 18px 24px 14px;
      display: flex; flex-direction: column; gap: 0;
      position: relative; z-index: 1;
    }

    .ts-row {
      display: grid;
      grid-template-columns: 44px 1fr 120px 1fr 44px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      gap: 10px;
    }
    .ts-row:last-child { border-bottom: none; }

    .ts-pct {
      font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 700;
    }
    .ts-pct-left { text-align: left; color: #f5c842; }
    .ts-pct-right { text-align: right; color: rgba(255,255,255,0.5); }

    .ts-label {
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.38);
      text-transform: uppercase; letter-spacing: 0.5px;
      text-align: center; white-space: nowrap;
    }

    /* Left bar (NaVi — yellow, grows right→left from center) */
    .ts-bar-left-wrap {
      height: 8px; border-radius: 4px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
      display: flex; justify-content: flex-end; /* bar anchored to right */
    }
    .ts-bar-left {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, rgba(245,200,66,0.5), #f5c842);
    }

    /* Right bar (Spirit — dark steel, grows left→right from center) */
    .ts-bar-right-wrap {
      height: 8px; border-radius: 4px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
      display: flex; justify-content: flex-start; /* bar anchored to left */
    }
    .ts-bar-right {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #2e3a5a, #4a5a7a);
    }

    /* ── FOOTER ── */
    .ts-footer {
      display: grid; grid-template-columns: 1fr auto 1fr;
      padding: 10px 24px 14px;
      border-top: 1px solid rgba(255,255,255,0.05);
      position: relative; z-index: 1;
    }
    .ts-sample {
      font-size: 11px; color: rgba(255,255,255,0.28); font-weight: 600;
    }
    .ts-sample-right { text-align: right; }
    .ts-chevron {
      font-size: 14px; color: rgba(255,255,255,0.3); text-align: center; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="card">

  <!-- Tabs -->
  <div class="ts-tabs">
    <div class="ts-tab active">Team stats</div>
    <div class="ts-tab">Players stats</div>
    <div class="ts-tab">Tournament stats</div>
    <div class="ts-close">✕</div>
  </div>

  <!-- Header -->
  <div class="ts-header">
    <div class="ts-team">
      <img src="NAVI_Logo_2020.png" style="width:28px;height:28px;object-fit:contain;mix-blend-mode:multiply;"/>
      <span style="color:#f5c842;">Natus Vincere</span>
    </div>
    <div class="ts-title">Team Stats</div>
    <div class="ts-team ts-team-right">
      <span style="color:rgba(255,255,255,0.6);">Team Spirit</span>
      <img src="spirit.png" style="width:28px;height:28px;object-fit:contain;filter:invert(1);mix-blend-mode:screen;"/>
    </div>
  </div>

  <!-- Stats -->
  <div class="ts-body">

    <!-- Map winrate -->
    <div class="ts-row">
      <span class="ts-pct ts-pct-left">67%</span>
      <div class="ts-bar-left-wrap"><div class="ts-bar-left" style="width:67%"></div></div>
      <div class="ts-label">Map winrate</div>
      <div class="ts-bar-right-wrap"><div class="ts-bar-right" style="width:58%"></div></div>
      <span class="ts-pct ts-pct-right">58%</span>
    </div>

    <!-- Round winrate -->
    <div class="ts-row">
      <span class="ts-pct ts-pct-left">53%</span>
      <div class="ts-bar-left-wrap"><div class="ts-bar-left" style="width:53%"></div></div>
      <div class="ts-label">Round winrate</div>
      <div class="ts-bar-right-wrap"><div class="ts-bar-right" style="width:51%"></div></div>
      <span class="ts-pct ts-pct-right">51%</span>
    </div>

    <!-- T-side winrate -->
    <div class="ts-row">
      <span class="ts-pct ts-pct-left">55%</span>
      <div class="ts-bar-left-wrap"><div class="ts-bar-left" style="width:55%"></div></div>
      <div class="ts-label">T-side winrate</div>
      <div class="ts-bar-right-wrap"><div class="ts-bar-right" style="width:48%"></div></div>
      <span class="ts-pct ts-pct-right">48%</span>
    </div>

    <!-- CT-side winrate -->
    <div class="ts-row">
      <span class="ts-pct ts-pct-left">61%</span>
      <div class="ts-bar-left-wrap"><div class="ts-bar-left" style="width:61%"></div></div>
      <div class="ts-label">CT-side winrate</div>
      <div class="ts-bar-right-wrap"><div class="ts-bar-right" style="width:54%"></div></div>
      <span class="ts-pct ts-pct-right">54%</span>
    </div>

    <!-- Pistol round winrate -->
    <div class="ts-row">
      <span class="ts-pct ts-pct-left">58%</span>
      <div class="ts-bar-left-wrap"><div class="ts-bar-left" style="width:58%"></div></div>
      <div class="ts-label">Pistol round winrate</div>
      <div class="ts-bar-right-wrap"><div class="ts-bar-right" style="width:52%"></div></div>
      <span class="ts-pct ts-pct-right">52%</span>
    </div>

  </div>

  <!-- Footer -->
  <div class="ts-footer">
    <span class="ts-sample">Sample size: 38 maps</span>
    <span class="ts-chevron">∨</span>
    <span class="ts-sample ts-sample-right">Sample size: 31 maps</span>
  </div>

</div>
</body>
</html>
