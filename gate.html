<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    input {
      border: none; border-bottom: 1.5px solid #000;
      outline: none; background: transparent;
      font-size: 16px; letter-spacing: 4px;
      text-align: center; width: 200px; padding: 6px 0;
      color: #000;
    }
    input::placeholder { letter-spacing: 2px; color: #999; font-size: 13px; }
    .err { font-size: 12px; color: #000; opacity: 0; transition: opacity 0.2s; min-height: 16px; }
    .err.show { opacity: 1; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}
    }
    .shake { animation: shake 0.3s ease; }
  </style>
</head>
<body>
  <div class="wrap">
    <input id="inp" type="password" placeholder="enter code" autocomplete="off" maxlength="30"/>
    <div class="err" id="err">Incorrect code</div>
  </div>
  <script>
    var CODE = 'skbtest26';
    var KEY  = 'sb_access';
    if (sessionStorage.getItem(KEY) === '1') window.location.replace('index.html');
    var inp = document.getElementById('inp');
    var err = document.getElementById('err');
    function attempt() {
      if (inp.value.trim() === CODE) {
        sessionStorage.setItem(KEY, '1');
        window.location.replace('index.html');
      } else {
        err.classList.add('show');
        inp.classList.remove('shake');
        void inp.offsetWidth;
        inp.classList.add('shake');
        inp.value = '';
        inp.focus();
      }
    }
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(); });
    inp.addEventListener('input', function(){ err.classList.remove('show'); });
    inp.focus();
  </script>
</body>
</html>
